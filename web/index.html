<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f62fe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TracKING GO" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TracKING GO</title>
    <style>
      /* Pantalla de entrada: diseño plano, movimientos cortos y suaves */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#1747c9;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .5s ease,visibility .5s ease}
      #splash.out{opacity:0;visibility:hidden}
      .sp-mark{width:132px;height:132px;overflow:visible}
      .sp-mark g{transform-box:fill-box;transform-origin:50% 100%}
      .sp-pin{opacity:0;animation:sp-up .5s cubic-bezier(.2,.8,.2,1) .05s forwards}
      .sp-ring{opacity:0;transform-origin:50% 50%!important;animation:sp-ring .6s cubic-bezier(.2,.8,.2,1) .2s forwards}
      .sp-ring.outer{animation:sp-ring .6s cubic-bezier(.2,.8,.2,1) .2s forwards,sp-pulse 2s ease-in-out 1s infinite}
      .sp-crown{opacity:0;animation:sp-crown .45s cubic-bezier(.2,.8,.2,1) .55s forwards}
      .sp-word{position:relative;font-size:38px;font-weight:800;letter-spacing:-.5px;line-height:1;clip-path:inset(-24px 100% -8px 0);animation:sp-reveal .6s cubic-bezier(.65,0,.35,1) .7s forwards}
      .sp-word .k{color:#f4b400;position:relative}
      .sp-word .g{color:#6cc8ff}
      .sp-word .mini{position:absolute;left:.36em;top:-11px;width:20px;height:12px;margin-left:-10px}
      .sp-sub{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:sp-fade .5s ease 1.15s forwards}
      .sp-bar{width:140px;height:3px;margin-top:6px;border-radius:3px;background:#ffffff2e;overflow:hidden}
      .sp-bar i{display:block;height:100%;width:100%;background:#f4b400;transform:scaleX(0);transform-origin:0 50%;animation:sp-load 2.1s cubic-bezier(.4,0,.2,1) .1s forwards}
      @keyframes sp-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes sp-ring{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
      @keyframes sp-pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes sp-crown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
      @keyframes sp-reveal{to{clip-path:inset(-24px 0 -8px 0)}}
      @keyframes sp-fade{to{opacity:.85}}
      @keyframes sp-load{to{transform:scaleX(1)}}
      /* Toques animados dentro de la app */
      .brand-dot{animation:dot-ping 2s ease-out infinite}
      @keyframes dot-ping{0%{box-shadow:0 0 0 0 #3b82f699}70%{box-shadow:0 0 0 10px #3b82f600}100%{box-shadow:0 0 0 0 #3b82f600}}
      .auth-hero{background-size:28px 28px,200% 200%!important;animation:hero-move 14s ease-in-out infinite alternate}
      @keyframes hero-move{0%{background-position:0 0,0% 50%}100%{background-position:56px 28px,100% 50%}}
      .auth-hero-text,.auth-card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
      .auth-card{animation-delay:.15s}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.brand-dot,.auth-hero,.auth-hero-text,.auth-card{animation:none!important;opacity:1!important;transform:none!important}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-mark" viewBox="0 0 200 200" aria-hidden="true">
        <g class="sp-ring outer"><ellipse cx="100" cy="166" rx="54" ry="14" fill="none" stroke="#6cc8ff" stroke-width="5"/></g>
        <g class="sp-ring"><ellipse cx="100" cy="166" rx="28" ry="7" fill="none" stroke="#fff" stroke-width="3.5"/></g>
        <g class="sp-pin"><path fill="#fff" d="M100 170C82 146 61 127 61 102a39 39 0 0 1 78 0c0 25-21 44-39 68z"/><circle cx="100" cy="101" r="16" fill="#1747c9"/></g>
        <g class="sp-crown"><path fill="#f4b400" d="M66 50l-4-32 23 17 15-25 15 25 23-17-4 32z"/><rect x="65" y="50" width="70" height="10" rx="3" fill="#e09a00"/><circle cx="62" cy="15" r="5" fill="#f4b400"/><circle cx="100" cy="7" r="5.5" fill="#f4b400"/><circle cx="138" cy="15" r="5" fill="#f4b400"/><path fill="#e5322d" d="M100 31l5 6-5 6-5-6z"/></g>
      </svg>
      <div class="sp-word">Trac<span class="k"><svg class="mini" viewBox="0 0 64 40" aria-hidden="true"><path fill="#f4b400" d="M6 28L3 4l15 11L32 0l14 15 15-11-3 24z"/><rect x="5" y="30" width="54" height="8" rx="2" fill="#e09a00"/></svg>KING</span><span class="g"> GO</span></div>
      <div class="sp-sub">Rastreo de flota en vivo</div>
      <div class="sp-bar"><i></i></div>
    </div>
    <script>setTimeout(function(){var s=document.getElementById('splash');if(!s)return;s.classList.add('out');setTimeout(function(){s.remove()},700)},2300)</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
